services:

  db:
    image: postgres:16

    container_name: expenseiq-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: expenseiq_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expenseiq_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  api:
    build: .

    container_name: expenseiq-api

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/expenseiq_db
      SECRET_KEY: ${SECRET_KEY}

    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_data: