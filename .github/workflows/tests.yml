          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests -v



          name: ExpenseIQ CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expenseiq_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d expenseiq_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expenseiq_test_db
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expenseiq_test_db
      POSTGRES_PASSWORD: postgres
      SECRET_KEY: github-actions-test-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests -v

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name expenseiqacr2026

      - name: Build Docker image
        run: |
          docker build -t expenseiqacr2026.azurecr.io/expenseiq:${{ github.sha }} .
          docker tag expenseiqacr2026.azurecr.io/expenseiq:${{ github.sha }} expenseiqacr2026.azurecr.io/expenseiq:latest

      - name: Push Docker image
        run: |
          docker push expenseiqacr2026.azurecr.io/expenseiq:${{ github.sha }}
          docker push expenseiqacr2026.azurecr.io/expenseiq:latest

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name expenseiq-api \
            --resource-group expenseiq-rg \
            --image expenseiqacr2026.azurecr.io/expenseiq:${{ github.sha }}